name: CI-CD (Preview + Controlled Release + Cleanup)

permissions:
  contents: write

on:
  push:
    branches:
      - develop
      - beta
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:
    inputs:
      environment:
        description: "Select environment"
        required: true
        type: choice
        options: [develop, beta, main]
      version:
        description: "Optional version (tag)"
        required: false

jobs:

  versioning:
    runs-on: [self-hosted, Windows, X64]
    if: github.event_name == 'push' && github.ref_name == 'develop'
    outputs:
      created_tag: ${{ steps.calc.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Tag
        id: calc
        shell: powershell
        run: |
          git fetch --tags --force

          $date = Get-Date -Format "yyyy-MM-dd"
          $lastTag = git tag --list "v*" |
            Sort-Object {[version]($_ -replace '^v','' -replace '-.*','')} |
            Select-Object -Last 1

          if (-not $lastTag) { $lastTag = "v1.0.000" }

          $clean = $lastTag -replace '^v','' -replace '-.*',''
          $parts = $clean.Split(".")
          $major = [int]$parts[0]
          $minor = [int]$parts[1]
          $patch = [int]$parts[2] + 1

          $patchPadded = "{0:D3}" -f $patch
          $newTag = "v$major.$minor.$patchPadded-$date"

          echo "version=$newTag" >> $env:GITHUB_OUTPUT

          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git tag -a $newTag -m "Release $newTag"
          git push origin $newTag

  deploy:
    runs-on: [self-hosted, Windows, X64]
    needs: versioning
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && (github.ref_name == 'develop' || github.ref_name == 'beta' || github.ref_name == 'main'))

    steps:

      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve Environment & Tag
        id: target
        shell: powershell
        run: |
          git fetch --tags

          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $envName = "${{ github.event.inputs.environment }}"
            $version = "${{ github.event.inputs.version }}"
          } else {
            $envName = "${{ github.ref_name }}"
            $version = git tag --points-at HEAD | Select-Object -First 1
          }

          if (-not $version) {
            $version = git describe --tags --abbrev=0
          }

          if ($envName -eq "develop") { 
              $namespace = "default"
              $repo = "aesthisia-demo" 
          }
          elseif ($envName -eq "beta") { 
              $namespace = "beta"
              $repo = "stage-test" 
          }
          else { 
              $namespace = "prod"
              $repo = "prod-test" 
          }

          echo "ENV=$envName" >> $env:GITHUB_OUTPUT
          echo "NAMESPACE=$namespace" >> $env:GITHUB_OUTPUT
          echo "REPO=$repo" >> $env:GITHUB_OUTPUT
          echo "VER=$version" >> $env:GITHUB_OUTPUT

      # 🔥 Merge TAG into correct branch
      - name: Sync Tag → Branch
        shell: powershell
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          $branch = "${{ steps.target.outputs.ENV }}"
          $tag = "${{ steps.target.outputs.VER }}"

          git checkout $branch
          git pull origin $branch

          git merge $tag --no-edit
          git push origin $branch

      # 🔥 Checkout updated branch
      - name: Checkout Updated Branch
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.ENV }}

      - name: Docker Build & Push
        shell: powershell
        run: |
          $image = "${{ secrets.DOCKER_USERNAME }}/${{ steps.target.outputs.REPO }}:${{ steps.target.outputs.VER }}"

          docker login -u "${{ secrets.DOCKER_USERNAME }}" -p "${{ secrets.DOCKER_PASSWORD }}"

          docker build --no-cache -t $image .
          docker push $image

          echo "FINAL_IMAGE=$image" >> $env:GITHUB_ENV

      - name: Deploy to Kubernetes
        shell: powershell
        run: |
          $namespace = "${{ steps.target.outputs.NAMESPACE }}"
          $host = "$namespace.127.0.0.1.nip.io"

          kubectl create namespace $namespace --dry-run=client -o yaml | kubectl apply -f -

          (Get-Content deployment.yml) `
            -replace 'NAMESPACE_PLACEHOLDER', "$namespace" `
            -replace 'IMAGE_PLACEHOLDER', "$env:FINAL_IMAGE" `
            -replace 'HOST_PLACEHOLDER', "$host" |
            kubectl apply -n $namespace -f -

          kubectl rollout restart deployment/sample-app -n $namespace
