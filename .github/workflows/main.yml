name: CI-CD (Preview + Controlled Release + Cleanup)

permissions:
  contents: write

on:
  push:
    branches:
      - develop
      - beta
      - main

  pull_request:
    types: [opened, synchronize, reopened, closed]

  workflow_dispatch:
    inputs:
      environment:
        description: "Select environment"
        required: true
        type: choice
        options: [develop, beta, main]
      version:
        description: "Optional version (tag)"
        required: false

jobs:


  versioning:
    runs-on: [self-hosted, Windows, X64]
    if: github.event_name == 'push' && github.ref_name == 'develop'
    outputs:
      created_tag: ${{ steps.calc.outputs.version }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Tag
        id: calc
        shell: powershell
        run: |
          git fetch --tags --force

          $date = Get-Date -Format "yyyy-MM-dd"

          $lastTag = git tag --list "v*" |
            Sort-Object {[version]($_ -replace '^v','' -replace '-.*','')} |
            Select-Object -Last 1

          if (-not $lastTag) { $lastTag = "v1.0.000" }

          $clean = $lastTag -replace '^v','' -replace '-.*',''
          $parts = $clean.Split(".")
          $major = [int]$parts[0]
          $minor = [int]$parts[1]
          $patch = [int]$parts[2] + 1

          $patchPadded = "{0:D3}" -f $patch
          $newTag = "v$major.$minor.$patchPadded-$date"

          echo "version=$newTag" >> $env:GITHUB_OUTPUT

          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git tag -a $newTag -m "Release $newTag"
          git push origin $newTag


# 🧪 PREVIEW DEPLOY
  preview-deploy:
    runs-on: [self-hosted, Windows, X64]
    if: |
      github.event_name == 'pull_request' &&
      github.event.action != 'closed' &&
      github.base_ref != 'develop' &&
      github.base_ref != 'beta' &&
      github.base_ref != 'main'

    steps:
      - uses: actions/checkout@v4

      - name: Set dynamic variables
        shell: powershell
        run: |
          $branch = "${{ github.head_ref }}"
          $namespace = $branch.ToLower() -replace '[^a-z0-9]', '-'
          $ingressHost = "$namespace.127.0.0.1.nip.io"
          $image = "${{ secrets.DOCKER_USERNAME }}/aesthisia-demo:$namespace-${{ github.run_number }}"

          "NAMESPACE=$namespace" >> $env:GITHUB_ENV
          "HOST=$ingressHost" >> $env:GITHUB_ENV
          "IMAGE=$image" >> $env:GITHUB_ENV

      - name: Docker Build & Push
        shell: powershell
        run: |
          docker login -u "${{ secrets.DOCKER_USERNAME }}" -p "${{ secrets.DOCKER_PASSWORD }}"
          docker build -t $env:IMAGE .
          docker push $env:IMAGE

      - name: Deploy Preview
        shell: powershell
        run: |
          kubectl create namespace $env:NAMESPACE --dry-run=client -o yaml | kubectl apply -f -

          (Get-Content deployment.yml) `
            -replace 'NAMESPACE_PLACEHOLDER', "$env:NAMESPACE" `
            -replace 'IMAGE_PLACEHOLDER', "$env:IMAGE" `
            -replace 'HOST_PLACEHOLDER', "$env:HOST" |
            kubectl apply -n $env:NAMESPACE -f -


# 🧹 CLEANUP
  cleanup:
    runs-on: [self-hosted, Windows, X64]
    if: |
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.base_ref != 'develop' &&
      github.base_ref != 'beta' &&
      github.base_ref != 'main'

    steps:
      - name: Delete Namespace
        shell: powershell
        run: |
          $name = "${{ github.head_ref }}".ToLower() -replace '[^a-z0-9]', '-'

          if ($name -notin @("default", "beta", "prod")) {
            kubectl delete namespace $name --ignore-not-found=true
          }


# 🚀 DEPLOY (FIXED FLOW)
  deploy:
    runs-on: [self-hosted, Windows, X64]
    #needs: versioning
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && (github.ref_name == 'develop' || github.ref_name == 'beta' || github.ref_name == 'main'))

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve Env & Tag
        id: target
        shell: powershell
        run: |
          git fetch --tags

          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $envName = "${{ github.event.inputs.environment }}"
            $version = "${{ github.event.inputs.version }}"
          } else {
            $envName = "${{ github.ref_name }}"
            $version = git tag --points-at HEAD | Select-Object -First 1
          }

          if (-not $version) {
            $version = git describe --tags --abbrev=0
          }

          if ($envName -eq "develop") { 
              $namespace = "default"
              $repo = "aesthisia-demo" 
          }
          elseif ($envName -eq "beta") { 
              $namespace = "beta"
              $repo = "stage-test" 
          }
          else { 
              $namespace = "prod"
              $repo = "prod-test" 
          }

          echo "ENV=$envName" >> $env:GITHUB_OUTPUT
          echo "NAMESPACE=$namespace" >> $env:GITHUB_OUTPUT
          echo "REPO=$repo" >> $env:GITHUB_OUTPUT
          echo "VER=$version" >> $env:GITHUB_OUTPUT


      # ✅ FIXED: Move branch to selected tag
      - name: Sync Branch to Tag
        shell: powershell
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          $branch = "${{ steps.target.outputs.ENV }}"
          $tag = "${{ steps.target.outputs.VER }}"

          git fetch origin --tags

          git checkout $branch
          git reset --hard $tag
          git push origin $branch --force


      - name: Checkout Updated Branch
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.ENV }}


      - name: Docker Build & Push
        shell: powershell
        run: |
          $image = "${{ secrets.DOCKER_USERNAME }}/${{ steps.target.outputs.REPO }}:${{ steps.target.outputs.VER }}"

          docker login -u "${{ secrets.DOCKER_USERNAME }}" -p "${{ secrets.DOCKER_PASSWORD }}"

          docker build --no-cache -t $image .
          docker push $image

          echo "FINAL_IMAGE=$image" >> $env:GITHUB_ENV


      - name: Deploy to Kubernetes
        shell: powershell
        run: |
          $namespace = "${{ steps.target.outputs.NAMESPACE }}"
          $ingressHost = "$namespace.127.0.0.1.nip.io"

          kubectl create namespace $namespace --dry-run=client -o yaml | kubectl apply -f -

          (Get-Content deployment.yml) `
            -replace 'NAMESPACE_PLACEHOLDER', "$namespace" `
            -replace 'IMAGE_PLACEHOLDER', "$env:FINAL_IMAGE" `
            -replace 'HOST_PLACEHOLDER', "$ingressHost" |
            kubectl apply -n $namespace -f -

          kubectl rollout restart deployment/sample-app -n $namespace
